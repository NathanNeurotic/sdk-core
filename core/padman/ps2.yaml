project: padman

targets:
  - name: padman
    type: iop
    linkfile: ../startup/share/iop/linkfile
    sources:
      - src/freepad.c
      - src/rpcserver.c
      - src/padInit.c
      - src/padPortOpen.c
      - src/padMiscFuncs.c
      - src/sio2Cmds.c
      - src/padData.c
      - src/padCmds.c
    defines:
      - BUILDING_XPADMAN
    imports_lst: src/imports.lst
    exports_tab: src/exports.tab
    include_dirs:
      - include
      - ../loadcore/include
      - ../intrman/include
      - ../threadman/include
      - ../sifman/include
      - ../sifcmd/include
      - ../sio2man/include
      - ../sysclib/include
      - ../sysmem/include
      - ../vblank/include
      - ../stdio/include
      - src
