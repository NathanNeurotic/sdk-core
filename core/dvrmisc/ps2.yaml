project: dvrmisc

targets:
  - name: dvrmisc
    type: iop
    linkfile: ../startup/share/iop/linkfile
    sources:
      - src/dvrmisc.c
    defines:
      - IOMANX_OLD_NAME_COMPATIBILITY=0
      - IOMANX_OLD_NAME_ADDDELDRV=0
      - DVRMISC_CFW_EXTENSIONS
    imports_lst: src/imports.lst
    include_dirs:
      - src
      - ../pvrdrv/include
      - ../iomanx/include
      - ../loadcore/include
      - ../stdio/include
      - ../sysclib/include
      - ../threadman/include
