project: usbd

targets:
  - name: usbd
    type: iop
    linkfile: ../startup/share/iop/linkfile
    sources:
      - src/hub.c
      - src/mem.c
      - src/timer.c
      - src/endpoint.c
      - src/io_request.c
      - src/hub_resets.c
      - src/td_queue.c
      - src/hcd.c
      - src/usbd_sys.c
      - src/usbd_api.c
      - src/usbd_main.c
      - src/report_descriptor_init.c
      - src/device_driver.c
      - src/device.c
    imports_lst: src/imports.lst
    exports_tab: src/exports.tab
    include_dirs:
      - include
      - src
      - ../loadcore/include
      - ../intrman/include
      - ../stdio/include
      - ../sysclib/include
      - ../sysmem/include
      - ../threadman/include
