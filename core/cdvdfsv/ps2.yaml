project: cdvdfsv

targets:
  - name: cdvdfsv
    type: iop
    linkfile: ../startup/share/iop/linkfile
    sources:
      - src/cdvdfsv.c
    defines:
      - BUILDING_CDVD_MODULE
    imports_lst: src/imports.lst
    exports_tab: src/exports.tab
    include_dirs:
      - include
      - src
      - ../cdvd/include
      - ../dmacman/include
      - ../intrman/include
      - ../iomanx/include
      - ../loadcore/include
      - ../sifcmd/include
      - ../sifman/include
      - ../stdio/include
      - ../sysclib/include
      - ../sysmem/include
      - ../threadman/include
