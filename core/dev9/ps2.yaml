project: dev9

targets:
  - name: dev9
    type: iop
    linkfile: ../startup/share/iop/linkfile
    sources:
      - src/ps2dev9.c
    imports_lst: src/imports.lst
    exports_tab: src/exports.tab
    defines:
      - DEV9_PSX_SUPPORT=1
      - DEV9_GAMESTAR_WORKAROUND=1
    include_dirs:
      - include
      - src
      - ../dmacman/include
      - ../intrman/include
      - ../ioman/include
      - ../iomanx/include
      - ../loadcore/include
      - ../stdio/include
      - ../sysclib/include
      - ../threadman/include
