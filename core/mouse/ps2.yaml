project: mouse

targets:
  - name: mouse
    type: ee_lib
    sources:
      - src/libmouse.c
    include_dirs:
      - include
      - ../kernel/include

  - name: ps2mousedrv
    type: iop
    linkfile: ../startup/share/iop/linkfile
    sources:
      - src/iop/ps2mouse.c
    imports_lst: src/iop/imports.lst
    include_dirs:
      - include/iop
      - src/iop
      - ../intrman/include
      - ../iomanx/include
      - ../loadcore/include
      - ../sifcmd/include
      - ../stdio/include
      - ../sysclib/include
      - ../sysmem/include
      - ../threadman/include
      - ../usbd/include
