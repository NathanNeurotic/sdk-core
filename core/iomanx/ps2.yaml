project: iomanx

targets:
  - name: iomanx
    type: iop
    linkfile: ../startup/share/iop/linkfile
    sources:
      - src/iomanX.c
      - src/ioman_sbv.c
    imports_lst: src/imports.lst
    exports_tab: src/exports.tab
    defines:
      - IOMANX_OLD_NAME_ADDDELDRV=0
      - IOMANX_OLD_NAME_COMPATIBILITY=0
      - IOMANX_ENABLE_LEGACY_IOMAN_HOOK
      - IOMAN_USE_FILE_STRUCT_TEMP_STACK
    include_dirs:
      - include
      - ../intrman/include
      - ../loadcore/include
      - ../stdio/include
      - ../sysclib/include
      - ../sysmem/include
      - ../threadman/include
      - src
