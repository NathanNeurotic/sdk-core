project: mtapman

targets:
  - name: mtapman
    type: iop
    linkfile: ../startup/share/iop/linkfile
    sources:
      - src/freemtap.c
      - src/rpcservers.c
    defines:
      - SIO2MAN_V2
    imports_lst: src/imports.lst
    exports_tab: src/exports.tab
    include_dirs:
      - include
      - src
      - ../loadcore/include
      - ../sifman/include
      - ../sifcmd/include
      - ../stdio/include
      - ../threadman/include
      - ../sio2man/include
