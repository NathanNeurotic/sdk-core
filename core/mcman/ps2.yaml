project: mcman

targets:
  - name: mcman
    type: iop
    linkfile: ../startup/share/iop/linkfile
    sources:
      - src/main.c
      - src/mcdev.c
      - src/mciomanx_backing.c
      - src/mcsio2.c
      - src/ps1mc_fio.c
      - src/ps2mc_fio.c
    defines:
      - BUILDING_XMCMAN
    imports_lst: src/imports.lst
    exports_tab: src/exports.tab
    include_dirs:
      - include
      - ../cdvd/include
      - ../secrman/include
      - ../sior/include
      - ../sio2man/include
      - ../intrman/include
      - ../ioman/include
      - ../iomanx/include
      - ../loadcore/include
      - ../modload/include
      - ../stdio/include
      - ../sysclib/include
      - ../threadman/include
      - ../timrman/include
      - src
