project: mx4sio_bd_mini

targets:
  - name: mx4sio_bd_mini
    type: iop
    linkfile: ../startup/share/iop/linkfile
    sources:
      - ../mx4sio_bd/src/spi_sdcard_crc7.c
      - ../mx4sio_bd/src/spi_sdcard_driver.c
      - ../mx4sio_bd/src/crc16.c
      - ../mx4sio_bd/src/ioplib.c
      - ../mx4sio_bd/src/sio2man_hook.c
      - ../mx4sio_bd/src/mx4sio.c
    imports_lst: ../mx4sio_bd/src/imports.lst
    libs: [gcc]
    defines:
      - MINI_DRIVER
    include_dirs:
      - ../mx4sio_bd/src
      - ../bdm/include
      - ../sio2man/include
      - ../dmacman/include
      - ../intrman/include
      - ../loadcore/include
      - ../stdio/include
      - ../sysclib/include
      - ../threadman/include
